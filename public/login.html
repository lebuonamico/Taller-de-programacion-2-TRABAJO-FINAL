<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Login</h1>
        <form id="loginForm" class="form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Ingresar</button>
        </form>
        <div id="tokenResult" class="token-box hidden">
            <div class="token-label">Token generado</div>
            <textarea id="tokenOutput" readonly></textarea>
            <button id="copyTokenBtn" type="button">Copiar token</button>
        </div>
        <div id="message" class="message"></div>
        <div class="footer-links">
            <a href="register.html">Ir a Registro</a>
            <a href="index.html">Volver al inicio</a>
        </div>
    </main>
    <script src="js/user-actions.js"></script>
</body>
</html>
